appId: com.evrakplus.dersdagitim.multiplus
productName: EvrakPlus Ders Dagitim Multi Plus
copyright: Copyright © 2026 EvrakPlus
directories:
  output: release
  buildResources: build
asar: true
files:
  - electron/**/*
  - renderer/**/*
  - package.json
extraResources:
  - from: resources/engines/ortools
    to: engines/ortools
  - from: resources/engines/timefold
    to: engines/timefold
  - from: resources/engines/choco
    to: engines/choco
  - from: resources/engines/minizinc
    to: engines/minizinc
  - from: resources/runtime/java
    to: runtime/java
  - from: resources/models
    to: models
  - from: THIRD_PARTY_LICENSES.md
    to: licenses/THIRD_PARTY_LICENSES.md
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EvrakPlus Ders Dagitim Multi Plus
  artifactName: EvrakPlus-Ders-Dagitim-Multi-Plus-${version}-Setup.${ext}
  include: build/installer.nsh
portable:
  artifactName: EvrakPlus-Ders-Dagitim-Multi-Plus-${version}-Portable.${ext}
publish:
  - provider: github
    owner: appoyanarates-ux
    repo: evrakplus-ders-dagitim-multi-plus
    releaseType: release
