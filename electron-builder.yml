appId: com.evrakplus.dersoptime
productName: DersOptime
copyright: Copyright © 2026 EvrakPlus
directories:
  output: release
  buildResources: build
asar: true
files:
  - electron/**/*
  - renderer/**/*
  - package.json
extraResources:
  - from: resources/engines/ortools
    to: engines/ortools
  - from: resources/engines/timefold
    to: engines/timefold
  - from: resources/engines/choco
    to: engines/choco
  - from: resources/engines/minizinc
    to: engines/minizinc
  - from: resources/runtime/java
    to: runtime/java
  - from: resources/models
    to: models
  - from: THIRD_PARTY_LICENSES.md
    to: licenses/THIRD_PARTY_LICENSES.md
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DersOptime Haftalik Ders Dagitim Programi
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: DersOptime-Haftalik-Ders-Dagitim-Programi-${version}-Setup.${ext}
  include: build/installer.nsh
portable:
  artifactName: DersOptime-Haftalik-Ders-Dagitim-Programi-${version}-Portable.${ext}
publish:
  - provider: github
    owner: appoyanarates-ux
    repo: evrakplus-ders-dagitim-multi-plus
    releaseType: release
