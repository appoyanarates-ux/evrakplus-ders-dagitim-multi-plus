name: CI Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  automated-tests:
    name: Python OR-Tools & JS Otomatik Testler
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: npm ci
      - run: |
          python -m venv .venv
          .venv\Scripts\pip.exe install -r solver\requirements.txt
      - run: .venv\Scripts\pytest.exe -v tests
      - run: powershell -ExecutionPolicy Bypass -File ./scripts/build_solver_windows.ps1
      - run: npm run test:js
