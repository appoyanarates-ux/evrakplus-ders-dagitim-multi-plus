name: EvrakPlus Multi Plus CI & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python Solvers
        run: python -m pip install ortools "pyscipopt<6" highspy fastapi uvicorn httpx
      - name: Run Core & Solver Tests
        run: node --test tests/unit/core-schema.test.js tests/unit/validator.test.js tests/unit/ortools.test.js tests/unit/scip.test.js tests/unit/highs.test.js tests/unit/wp-auth.test.js tests/unit/reports.test.js tests/unit/sync-engine.test.js tests/unit/pwa.test.js tests/unit/updater.test.js

  release-packages:
    needs: test-core
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Release Artifacts & SHA256SUMS
        shell: pwsh
        run: ./scripts/build-release-packages.ps1
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*
          generate_release_notes: true
